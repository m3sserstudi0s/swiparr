name: Package visibility

# One-off maintenance workflow: a container package first published with GITHUB_TOKEN
# is private, and the Packages REST API does not accept OAuth/GITHUB_TOKEN. This runs
# the visibility change with the only classic PAT the repo holds, and prints its scopes
# so a failure is diagnosable. Safe to delete once the package is public.
on:
  push:
    paths:
      - '.github/workflows/package-visibility.yml'
  workflow_dispatch:

jobs:
  set-public:
    runs-on: ubuntu-latest
    steps:
      - name: Show token scopes and set visibility
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          curl -sI -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user \
            | grep -i '^x-oauth-scopes' || true
          gh api -X PATCH /user/packages/container/messer-swipe -f visibility=public \
            && echo "visibility: public" \
            || echo "visibility: FAILED"
